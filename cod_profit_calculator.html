<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حاسبة صافي أرباح الدفع عند الاستلام (COD) | ZidanCode Suite</title>
    <style>
        :root {
            --bg-dark: #0b0f19;
            --bg-card: #151c2c;
            --border: #2a364f;
            --primary: #10b981;
            --accent: #38bdf8;
            --danger: #ef4444;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }
        body { background: var(--bg-dark); color: var(--text-main); font-family: sans-serif; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        .card { background: var(--bg-card); border: 1px solid var(--border); padding: 25px; border-radius: 12px; margin-bottom: 20px; }
        .grid-calc { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 5px; color: var(--text-muted); font-size: 0.9rem; }
        input { width: 100%; background: #090d16; border: 1px solid var(--border); padding: 10px; border-radius: 6px; color: white; box-sizing: border-box; }
        button { background: var(--primary); color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-weight: 600; width: 100%; }
        .results-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 20px; }
        .res-box { background: #090d16; padding: 15px; border-radius: 8px; text-align: center; border: 1px solid var(--border); }
        .res-box .val { font-size: 1.2rem; font-weight: bold; color: var(--accent); }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <h2>حاسبة صافي الأرباح (COD)</h2>
        <div class="grid-calc">
            <div class="form-group"><label>سعر بيع المنتج</label><input type="number" id="price" value="500"></div>
            <div class="form-group"><label>تكلفة المنتج</label><input type="number" id="cost" value="200"></div>
            <div class="form-group"><label>تكلفة الشحن</label><input type="number" id="shipping" value="50"></div>
            <div class="form-group"><label>تكلفة الإعلان للطلب (CPA)</label><input type="number" id="cpa" value="80"></div>
            <div class="form-group"><label>نسبة المرتجعات (%)</label><input type="number" id="returnRate" value="15"></div>
            <div class="form-group"><label>عدد الطلبات</label><input type="number" id="orders" value="10"></div>
        </div>
        <button onclick="calculate()">حساب النتائج</button>
    </div>

    <div class="card" id="results" style="display:none;">
        <div class="results-grid">
            <div class="res-box"><div class="val" id="rev">0</div>إجمالي الدخل</div>
            <div class="res-box"><div class="val" id="exp">0</div>إجمالي المصاريف</div>
            <div class="res-box"><div class="val" id="net">0</div>صافي الربح</div>
            <div class="res-box"><div class="val" id="roi">0</div>ROI %</div>
        </div>
    </div>
</div>

<script>
    function calculate() {
        const p = parseFloat(document.getElementById('price').value);
        const c = parseFloat(document.getElementById('cost').value);
        const s = parseFloat(document.getElementById('shipping').value);
        const cpa = parseFloat(document.getElementById('cpa').value);
        const rr = parseFloat(document.getElementById('returnRate').value) / 100;
        const o = parseInt(document.getElementById('orders').value);

        const successful = o * (1 - rr);
        const totalRevenue = successful * p;
        const totalExpenses = (o * (c + cpa + s)); 
        const netProfit = totalRevenue - totalExpenses;
        
        document.getElementById('rev').innerText = totalRevenue.toFixed(0);
        document.getElementById('exp').innerText = totalExpenses.toFixed(0);
        document.getElementById('net').innerText = netProfit.toFixed(0);
        document.getElementById('roi').innerText = totalExpenses > 0 ? ((netProfit / totalExpenses) * 100).toFixed(1) : 0;
        document.getElementById('results').style.display = 'block';
    }
</script>

    <style>
      #zcDemoBanner {
        position: fixed; bottom: 0; left: 0; right: 0; background: #0f172a; border-top: 2px solid #38bdf8;
        color: #f8fafc; padding: 10px 18px; display: flex; align-items: center; justify-content: space-between;
        z-index: 999998; font-family: Tahoma, sans-serif; direction: rtl; box-shadow: 0 -4px 20px rgba(0,0,0,0.6);
      }
      #zcDemoBanner button {
        background: #16a34a; color: #fff; border: none; padding: 8px 16px; border-radius: 8px;
        font-weight: bold; cursor: pointer; font-size: 14px;
      }
      #zcUnlockModal {
        display: none; position: fixed; inset: 0; background: rgba(7,13,25,0.92); z-index: 999999;
        align-items: center; justify-content: center; font-family: Tahoma, sans-serif; direction: rtl;
      }
      .zc-box {
        background: #0f172a; border: 2px solid #38bdf8; border-radius: 14px; padding: 24px;
        max-width: 440px; width: 92%; text-align: center; color: #f8fafc;
      }
    </style>
    <div id="zcDemoBanner">
      <span>🧪 <b>وضع التجربة المجانية (Demo):</b> يمكنك تجربة الأداة الآن — النسخة الكاملة بـ <b>350 ج.م</b></span>
      <button onclick="openZcUnlock()">🔓 تفعيل النسخة الكاملة</button>
    </div>
    <div id="zcUnlockModal">
      <div class="zc-box">
        <h3 style="color:#38bdf8;margin-top:0;">🔑 تفعيل النسخة الكاملة مدى الحياة</h3>
        <p style="font-size:13px;color:#cbd5e1;">ابعت كود بصمة جهازك على واتساب <b>+201090724210</b> لاستلام مفتاح التفعيل:</p>
        <div id="zcDevShow" style="background:#070d19;border:1px dashed #fbbf24;color:#fbbf24;padding:8px;border-radius:6px;font-family:monospace;font-size:16px;margin:10px 0;user-select:all;"></div>
        <input id="zcKeyField" type="text" placeholder="ZC-XXXX-XXXX-XXXX" style="width:92%;padding:10px;border-radius:6px;border:1px solid #475569;background:#070d19;color:#4ade80;text-align:center;font-family:monospace;font-size:15px;margin-bottom:10px;">
        <div style="display:flex;gap:8px;">
          <button onclick="activateZcNow()" style="flex:1;background:#0284c7;color:#fff;border:none;padding:10px;border-radius:6px;font-weight:bold;cursor:pointer;">تفعيل الآن ✅</button>
          <button onclick="document.getElementById('zcUnlockModal').style.display='none'" style="background:#334155;color:#fff;border:none;padding:10px 14px;border-radius:6px;cursor:pointer;">إغلاق</button>
        </div>
        <p id="zcStatusTxt" style="color:#f87171;font-size:12px;margin-top:8px;"></p>
      </div>
    </div>
    <script>
      document.addEventListener('contextmenu', e => e.preventDefault());
      document.onkeydown = e => { if (e.keyCode == 123) return false; };
      (async function() {
        const prodCode = "COD_PROFIT_CALCULATOR";
        let devId = localStorage.getItem('zc_dev_id');
        if (!devId) {
          devId = 'DEV-' + Math.random().toString(36).substring(2, 10).toUpperCase();
          localStorage.setItem('zc_dev_id', devId);
        }
        document.getElementById('zcDevShow').textContent = devId;

        const enc = new TextEncoder();
        const key = await crypto.subtle.importKey('raw', enc.encode('ZidanCode_Master_Secret_2026_ADL'), { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']);
        const sig = await crypto.subtle.sign('HMAC', key, enc.encode(devId + ':' + prodCode));
        const hex = Array.from(new Uint8Array(sig)).map(b => b.toString(16).padStart(2, '0')).join('').toUpperCase();
        const expectedKey = 'ZC-' + hex.slice(0,4) + '-' + hex.slice(4,8) + '-' + hex.slice(8,12);

        window.ZC_IS_PRO = (localStorage.getItem('Zidan_Key_' + prodCode) === expectedKey);
        if (window.ZC_IS_PRO) {
          document.getElementById('zcDemoBanner').style.display = 'none';
        } else {
          document.addEventListener('click', function(e) {
            const btn = e.target.closest('button');
            if (btn && !window.ZC_IS_PRO && /تصدير|تحميل|excel|csv|export|download|نسخ/i.test(btn.textContent)) {
              e.stopImmediatePropagation();
              e.preventDefault();
              openZcUnlock();
            }
          }, true);
        }

        window.openZcUnlock = function() {
          document.getElementById('zcUnlockModal').style.display = 'flex';
        };

        window.activateZcNow = function() {
          const val = document.getElementById('zcKeyField').value.trim().toUpperCase();
          if (val === expectedKey) {
            localStorage.setItem('Zidan_Key_' + prodCode, expectedKey);
            window.ZC_IS_PRO = true;
            document.getElementById('zcUnlockModal').style.display = 'none';
            document.getElementById('zcDemoBanner').style.display = 'none';
            alert('✅ تم تفعيل النسخة الكاملة بنجاح!');
          } else {
            document.getElementById('zcStatusTxt').textContent = '⚠️ مفتاح التفعيل غير صحيح لهذا الجهاز.';
          }
        };
      })();
    </script>
    
</body>
</html>
